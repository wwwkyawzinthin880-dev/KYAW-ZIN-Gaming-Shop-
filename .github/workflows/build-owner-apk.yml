name: Build Owner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "owner-apk/**"
      - ".github/workflows/build-owner-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        working-directory: owner-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="owner-apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "owner-apk/app/build/outputs/apk/debug/app-debug.apk"             --title "KYAW ZIN Owner APK ${GITHUB_RUN_NUMBER}"             --notes "KYAW ZIN Owner App APK. Requires the Owner PIN."
