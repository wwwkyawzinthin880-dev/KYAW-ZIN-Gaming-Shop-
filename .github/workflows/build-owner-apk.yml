name: Build Owner APK
on:
  workflow_dispatch:
  push:
    paths:
      - "owner-apk/**"
      - ".github/workflows/build-owner-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Owner APK
        working-directory: owner-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: KZ-Owner-APK
          path: owner-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-apk-v1.0.${{ github.run_number }}
          name: Owner APK v1.0.${{ github.run_number }}
          files: owner-apk/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
