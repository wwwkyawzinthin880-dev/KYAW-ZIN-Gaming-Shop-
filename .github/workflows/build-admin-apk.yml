name: Build KYAW ZIN APKs
on:
  push:
    paths:
      - 'admin-apk/**'
      - 'customer-apk/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
      - name: Build Admin APK
        working-directory: admin-apk
        run: ../gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
      - name: Build Customer APK
        working-directory: customer-apk
        run: ../gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Admin-APK
          path: admin-apk/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Customer-APK
          path: customer-apk/app/build/outputs/apk/debug/app-debug.apk
