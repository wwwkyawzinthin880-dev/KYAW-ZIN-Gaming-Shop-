name: Build Customer APK
on:
  push:
    paths:
      - "customer-apk/**"
      - ".github/workflows/build-customer-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Customer APK
        working-directory: customer-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: KZ-Customer-APK
          path: customer-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: customer-apk-v1.0.${{ github.run_number }}
          name: Customer APK v1.0.${{ github.run_number }}
          files: customer-apk/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
