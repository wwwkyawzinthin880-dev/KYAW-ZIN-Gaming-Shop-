<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#070b16;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#10172a;border:1px solid #26314b;border-radius:18px;padding:16px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0c1324;border-radius:14px;padding:14px}.stat b{font-size:22px;display:block;margin-top:5px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #253049}button{padding:12px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-weight:700}input{padding:12px;border-radius:12px;border:1px solid #303b56;background:#080e1c;color:#fff;width:100%}.hide{display:none}@media(max-width:650px){.stats{grid-template-columns:1fr}.table{overflow:auto}}</style></head><body><main class="wrap"><h1>KYAW ZIN Owner Dashboard</h1><div id="login" class="card"><p>Owner PIN</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button id="loginBtn" style="margin-top:10px">Login</button></div><div id="dash" class="hide"><div class="stats"><div class="stat">Orders<b id="orders">0</b></div><div class="stat">Sales<b id="sales">0 THB</b></div><div class="stat">Profit<b id="profit">0 THB</b></div></div><div class="card"><h3>Orders</h3><div class="table"><table><thead><tr><th>ID</th><th>Package</th><th>Player</th><th>Sale</th><th>Cost</th><th>Profit</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div><button id="clear">Clear demo orders</button> <a href="/" style="color:#9ca9c2;margin-left:12px">Customer site</a></div></main><script>
const PIN='2468';function load(){const a=JSON.parse(localStorage.getItem('kz_orders')||'[]');let sales=0,profit=0;rows.innerHTML=a.map(o=>{sales+=+o.price||0;profit+=+o.profit||0;return '<tr><td>'+o.id+'</td><td>'+((o.type==='wp'?o.qty+' Week WP':o.dia+' Dia'))+'</td><td>'+o.uid+'/'+o.zone+'</td><td>'+o.price+'</td><td>'+((o.cost??'—'))+'</td><td>'+((o.profit??'—'))+'</td><td>'+o.status+'</td></tr>'}).join('')||'<tr><td colspan="7">No orders</td></tr>';orders.textContent=a.length;sales.textContent=sales+' THB';profit.textContent=profit+' THB'}loginBtn.onclick=()=>{if(pin.value===PIN){login.classList.add('hide');dash.classList.remove('hide');load()}else alert('PIN မမှန်ပါ')};clear.onclick=()=>{localStorage.removeItem('kz_orders');load()};
</script></body></html>
