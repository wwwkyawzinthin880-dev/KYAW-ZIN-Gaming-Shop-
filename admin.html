<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYAW ZIN Admin</title><style>
body{font-family:Arial,"Noto Sans Myanmar",sans-serif;background:#f4f6fb;margin:0;color:#171923}.top{background:linear-gradient(135deg,#5f4cf4,#8b68ff);color:white;padding:20px}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:white;border:1px solid #e8eaf2;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:140px;background:#f8f9fc;border-radius:12px;padding:14px}.orders{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.badge{padding:5px 8px;border-radius:8px;background:#eee}.muted{color:#72788a;font-size:12px}.empty{text-align:center;padding:30px;color:#72788a}button{background:#6957ff;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
@media(max-width:600px){.top{padding:14px}.wrap{padding:10px}.top h2{font-size:20px;margin:0 0 6px}.stat{min-width:0;flex:1;padding:12px}.card{padding:12px;border-radius:14px}.orders{overflow:visible}table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{background:#f8f9fc;border-radius:12px;margin:10px 0;padding:8px}td{border:0;padding:7px 8px;text-align:left}td:before{font-weight:700;display:inline-block;width:95px;color:#555}td:nth-child(1):before{content:"Order ID"}td:nth-child(2):before{content:"Package"}td:nth-child(3):before{content:"Amount"}td:nth-child(4):before{content:"Game"}td:nth-child(5):before{content:"User/Zone"}td:nth-child(6):before{content:"Time"}td.empty:before{content:""} } </style></head><body><header class="top"><div class="wrap"><h2>🎮 KYAW ZIN Diamond Shop — Admin</h2><div>Order Dashboard</div></div></header>
<main class="wrap"><div class="row"><div class="stat"><b id="count">0</b><br><span class="muted">Browser Orders</span></div><div class="stat"><b id="total">0 THB</b><br><span class="muted">Total Amount</span></div></div>
<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>📋 Orders</h3><button onclick="load()">🔄 Refresh</button></div><div class="muted">ယခု version က ဒီ browser ထဲမှာ သိမ်းထားတဲ့ order history ကိုပဲ ပြပေးပါတယ်။ Server database မချိတ်ရသေးပါ။</div><div class="orders"><table><thead><tr><th>Order ID</th><th>Package</th><th>Amount</th><th>Game</th><th>User / Zone</th><th>Time</th></tr></thead><tbody id="body"></tbody></table></div></div>
</main><script>
function load(){const list=JSON.parse(localStorage.getItem('kz_order_history')||'[]');document.getElementById('count').textContent=list.length;document.getElementById('total').textContent=list.reduce((s,o)=>s+Number(o.price||0),0)+' THB';const b=document.getElementById('body');if(!list.length){b.innerHTML='<tr><td colspan="6" class="empty">Order မရှိသေးပါ။</td></tr>';return}b.innerHTML=list.map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.packageName+'</td><td>'+o.price+' THB</td><td>'+o.playerName+'</td><td>'+o.uid+' / '+o.zone+'</td><td>'+o.time+'</td></tr>').join('')}
load();
</script></body></html>
