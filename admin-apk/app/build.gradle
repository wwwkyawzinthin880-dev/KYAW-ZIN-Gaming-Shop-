plugins { id 'com.android.application' }
def props = new Properties()
def propsFile = rootProject.file('keystore.properties')
if (propsFile.exists()) { propsFile.withInputStream { props.load(it) } }
android {
    namespace 'com.kyawzin.admin'; compileSdk 35
    defaultConfig { applicationId 'com.kyawzin.admin'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.1' }
    signingConfigs {
        release {
            if (propsFile.exists()) {
                storeFile file(props['storeFile']); storePassword props['storePassword']
                keyAlias props['keyAlias']; keyPassword props['keyPassword']
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}